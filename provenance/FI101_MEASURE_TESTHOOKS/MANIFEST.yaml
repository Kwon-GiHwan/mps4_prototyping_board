  scope: "one boot session, no reboot between the good and the skipped run"
  result: "10/10 checks passed"
  detail:
    - "seq=1 normal RUN -> golden CRC 0x27084C4C"
    - "CMD_TEST_SKIP_NEXT_NPU accepted (ACK 0xFE)"
    - "seq=2 skipped RUN -> rc=0x534E5850, valid_flags=0x09 (RC_OK/OUTPUT_CHANGED clear)"
    - "GET_RESULT(seq=2) -> ERR_RESULT_NOT_VALID 0x000B, no payload, region never read"
    - "GET_RESULT(seq=1) -> ERR_RESULT_NOT_VALID 0x000B (superseded)"
    - "8-byte GET_RESULT -> ERR_LENGTH 0x0003"
  proves: >-
    RESULT_READY + invalid result yields exactly 0x000B. This is a DIFFERENT
    path from IDLE + GET_RESULT, which yields exactly 0x0005 via the dispatcher
    state gate. The two must never be treated as interchangeable.
