# --- TWO CLASSES, DELIBERATELY SEPARATED ------------------------------------
# Everything above (artifacts, source, linker, build, build_closure,
# qualification_evidence) is QUALIFICATION evidence: immutable, and any drift is
# a qualification failure.
#
# The section below is a SNAPSHOT of the host tooling as it stood when this
# image was qualified. Two different facts live here and must not be merged:
#   - the archived copies under working_snapshot/ are IMMUTABLE and must match;
#   - the live working copies under /home/gihwan/mps4/ are EXPECTED to change,
#     which is development, not drift, and is reported as informational only.
#
# Merging them is what turned an ordinary host-script edit into a 74/75
# "failure" that looked like archive corruption. A snapshot, once taken, is
# frozen -- but the worktree it was taken from is free to move on.
working_tooling_snapshot:
  schema_version: 1
  snapshot_id: "2026-08-08"
  archived_under: working_snapshot/
  immutable_snapshot: true
  current_worktree_may_differ: true
