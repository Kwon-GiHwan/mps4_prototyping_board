# Frozen provenance manifest. Written 2026-08-06 after functional acceptance.
#
# Two-layer verification, deliberately separated:
#   SHA256SUMS         -- byte integrity of every archived file (sha256sum -c)
#   verify_manifest.py -- required fields, disallowed nulls, cross-consistency
# The verifier is itself listed in SHA256SUMS so a modified verifier cannot
# quietly certify itself.
#
# Run BOTH at the start of every experiment session. A failure of either means
# data must not be recorded under this image_id.

