promotion_path:
  next_gate: "A/B/C contamination"
  on_pass: "qualification -> measurement-golden"
  measurement_scripts_freeze_required_before_first_run:
    - measurement/run_abc_gate.py
    - measurement/parse_abc_results.py
    - measurement/abc_config.yaml
  rule: >-
    If a measurement script changes after the first data is produced, results
    from before and after the change must not be combined into one set.
  a_gcc_golden_baseline: "no runner, no PMU; compare CRC, PASS, addresses, wall-clock only"
  b_measure_instrumentation_off: "runner present, PMU disabled"
  c_measure_end_only_pmu: "same image/path as B, PMU programming+snapshot only"
  comparisons:
    a_vs_b: "runner presence -- system-level contamination"
    b_vs_c: "PMU instrumentation contamination"
  prohibited: >-
    Do NOT compare NPU PMU cycles between A and B. A has no PMU interface, and
    adding one to A would stop it being the golden baseline.
  session_rule: >-
    The gate suite injects malformed frames and leaves parser/UART counters
    behind. Never run it in the same boot session as A/B/C measurement.
