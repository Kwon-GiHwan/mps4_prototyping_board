<text x="40.0" y="530.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#6b6b6b">Groups are the frozen common attribution partition: where small operations merge into one interrupt-service window, only the group effect is evaluable, not</text>
<text x="40.0" y="546.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#6b6b6b">per-operation cause. Bars show where cycles moved, not why — no group is claimed as the cause of the whole-model reversal.</text>
