<text x="40.0" y="483.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#6b6b6b">Bar shade darkens from Sram_Only to Dedicated_Sram. Only groups that move in at least one configuration are drawn. Every memory mode compiles to a different</text>
<text x="40.0" y="499.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#6b6b6b">artifact, so memory-system behaviour and compiler-generated program change remain NOT_SEPARATED: this is a configuration intervention, not a bandwidth</text>
