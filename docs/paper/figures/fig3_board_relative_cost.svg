<text x="40.0" y="45.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#6b6b6b">Ranking is preserved exactly: Spearman rho = 1.0, zero rank inversions across all seven workloads.</text>
<text x="40.0" y="62.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#6b6b6b">Each domain is divided by its own geometric mean, so the two bars are shapes to compare, not magnitudes.</text>
