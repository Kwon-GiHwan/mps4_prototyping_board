<text x="40.0" y="498.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#6b6b6b">No aggregate deviation statistic is shown: L1, L2, RMSE, MAPE and the board/FVP ratio were never preregistered, and choosing one with both vectors</text>
<text x="40.0" y="514.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#6b6b6b">visible would be selecting a statistic to fit the result. Absolute simulation-versus-hardware comparison is refused by construction: the two builds</text>
<text x="40.0" y="530.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#6b6b6b">are target-specific.</text>
<text x="40.0" y="552.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#6b6b6b">One physical configuration only — Corstone-320 / Ethos-U85 @ 1024 MACs, 21 formal samples.</text>
