<text x="758.0" y="420.5" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#6b6b6b">+4030</text>
<rect x="242.0" y="454.0" width="13.0" height="11.0" fill="#d55e00" opacity="1.0"/>
<text x="260.0" y="464.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1a1a1a">regress (slower at 512)</text>
<rect x="452.0" y="454.0" width="13.0" height="11.0" fill="#0072b2" opacity="1.0"/>
<text x="470.0" y="464.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1a1a1a">improve (faster at 512)</text>
<rect x="662.0" y="454.0" width="13.0" height="11.0" fill="#9a9a9a" opacity="1.0"/>
<text x="680.0" y="464.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1a1a1a">unchanged</text>
<text x="40.0" y="494.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#6b6b6b">Groups are the frozen common attribution partition: where small operations merge into one interrupt-service window, only the group effect is evaluable, not</text>
<text x="40.0" y="510.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#6b6b6b">per-operation cause. Bars show where cycles moved, not why — no group is claimed as the cause of the whole-model reversal.</text>
