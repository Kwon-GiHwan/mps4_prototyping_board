<svg xmlns="http://www.w3.org/2000/svg" width="940" height="564" viewBox="0 0 940 564"><rect width="940" height="564" fill="#ffffff"/>
<text x="40.0" y="26.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">Ethos-U85 256 → 512 MACs: per-operation-group cycle change for rnnoise</text>
<text x="40.0" y="45.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#6b6b6b">Ten groups regress, one improves, three are unchanged; the whole-model change is +19,060 cycles.</text>
<text x="40.0" y="62.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#6b6b6b">No single group accounts for the reversal — the largest is about a fifth of it.</text>
