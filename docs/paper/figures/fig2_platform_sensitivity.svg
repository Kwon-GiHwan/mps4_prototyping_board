<text x="238.0" y="348.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1a1a1a">agreed across the platform pair</text>
<rect x="470.0" y="338.0" width="13.0" height="11.0" fill="#d55e00" opacity="0.88"/>
<text x="488.0" y="348.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1a1a1a">disagreed</text>
<text x="40.0" y="374.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#6b6b6b">The only disagreements are eight threshold scaling-class labels, all in CLASS B, every one PARTIAL on the TA_ON side and STRONG on the TA_OFF side —</text>
<text x="40.0" y="390.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#6b6b6b">crossings of the frozen 0.75 cut point. No ranking, direction or saturation verdict changed anywhere.</text>
<text x="40.0" y="412.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#6b6b6b">In CLASS B the timing-adapter state, the subsystem and the Fast Models implementation change together: the disagreements are ASSOCIATED_WITH those</text>
<text x="40.0" y="428.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#6b6b6b">comparisons, never attributed to one factor.</text>
</svg>
