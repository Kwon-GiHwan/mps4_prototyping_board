<svg xmlns="http://www.w3.org/2000/svg" width="900" height="496" viewBox="0 0 900 496"><rect width="900" height="496" fill="#ffffff"/>
<text x="40.0" y="26.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">Which structural metrics survived a change of Corstone platform</text>
<text x="40.0" y="45.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#6b6b6b">Same NPU, same MAC configuration, byte-identical Vela artifact; only the host platform changes.</text>
<text x="40.0" y="62.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#6b6b6b">CLASS A holds timing-adapter state constant (SSE-310 ↔ SSE-315). CLASS B does not. The classes are never pooled.</text>
<text x="232.0" y="94.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#1a1a1a">CLASS A  (TA state constant)</text>
<text x="550.0" y="94.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#1a1a1a">CLASS B  (TA state differs)</text>
<text x="220.0" y="123.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" text-anchor="end" fill="#1a1a1a">workload ranking</text>
