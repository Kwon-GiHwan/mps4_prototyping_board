# --- CONTAINER REPRODUCTION: CORRECTED 2026-08-08 ----------------------------
# An earlier note in this file implied the archived Dockerfile closes the
# container gap. IT DOES NOT. Three layers diverge:
#
#   Dockerfile          installs FVP Corstone-300 (SSE-300) only
#   image               additionally has fvp_installed_320   <- SSE-320
#   running container   additionally has fvp_avh, fvp_installed_310
#
# The image is a `docker commit` snapshot, not a Dockerfile build. Rebuilding
# from the archived Dockerfile produces a DIFFERENT image that lacks the SSE-320
# FVP. And fvp_avh exists only inside the running container -- discard it and
# that install is gone, reproducible from nothing.
#
# The toolchain that actually builds the firmware (arm-none-eabi-gcc,
# ml-embedded-evaluation-kit) IS in the image, so firmware rebuild is unaffected.
# What is unreproducible is the FVP simulation environment.
container_reproduction:
  dockerfile_reproduces_image: false
  image_origin: "docker commit snapshot"
  missing_from_dockerfile: ["FVP SSE-320", "FVP SSE-310", "fvp_avh"]
  fvp_avh_location: "running container only -- not in the image"
  mlek_commit: b2c0bb2884698b7328f65c41b7c8c51ca9bec386   # 2026-04-21
  mlek_pin_gap: >-
    The Dockerfile does `git clone --recursive` with no commit pinned. The hash
    anchor for ethosu85_interface.h below depends on THIS tree; without the
    commit the anchor has no reproducible path. Pinned here.

# --- gaps found 2026-08-08 while auditing "can another machine reproduce this" -
host_environment:
  container_build_context: container-build-context/
  container_build_context_note: >-
    Backed up from /home/gihwan/fpga_simulator/ -- OUTSIDE the mps4 working
    directory, which is why every earlier sweep missed it. Contains the
    Dockerfile, .devcontainer, config.json, .env.example and scripts/. Without
    it the container digest below identifies an image nobody can rebuild.
  host_python_packages:
    pyserial: "3.5"
    recorded_as: prose only
    gap: >-
      There is no requirements.txt. pyserial 3.5 is named in RESULTS.yaml and
      MANIFEST.yaml as text, not as an installable spec, and the host venv's
      contents are not captured. Reproducing the HOST side on another machine
      is currently a guess.
  hardcoded_serial_port:
    value: "usb-FTDI_USB__-__Serial_Converter_00FT46259002B-if01-port0"
    appears_in: 7 files (mcc_harness.py, capture_all_uart.py, and 5 board tests)
    gap: >-
      The FTDI serial number of THIS board is baked into every script. On any
      other board or host all seven need editing. Nothing documents this as a
      porting step.

toolchain:
  distribution: "Arm GNU Toolchain 15.2.Rel1 (Build arm-15.86)"
  gcc:     "arm-none-eabi-gcc 15.2.1 20251203"
  ld:      "GNU ld 2.45.1.20251203"
  objcopy: "GNU objcopy 2.45.1.20251203"
  python:  "3.10.12"        # container; runs the generator and checkers

external_headers:
  ethosu85_interface_h_sha256_prefix: "8a5cbe762158db15651d65b278d71495"
  path: /opt/arm/ml-embedded-evaluation-kit/dependencies/core-driver/src/ethosu85_interface.h
  note: >-
    The register generator extracts from this file. If it changes,
    gen_npu_pmu_regs.py --check fails by design -- that is the intended
    behaviour, not a build break.
  cmsis: "cmsis-6 (ml-embedded-evaluation-kit/dependencies/cmsis-6)"

build:
  command: "make -f Makefile.measure PROFILE=clean bins"     # MEASURE_SEQ
  command_pmu: "make -f Makefile.pmu PROFILE=clean bins"     # PMU candidate
  workdir: /work/selftest
  environment: "no special variables; CFLAGS are fixed in the Makefile"

