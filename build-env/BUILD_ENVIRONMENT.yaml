# Build environment provenance.
#
# The restore drill (2026-08-08) showed the mirror verified cleanly but could
# NOT rebuild: every vendor directory (Device_SSE-320, Drivers, Tests, Serial,
# Sleep, Selftest_cli) was absent. Source hashes prove WHAT was built; this file
# plus the tarball below provide WHAT IT WAS BUILT AGAINST and WITH.
#
# This project has already been bitten by toolchain sensitivity -- armclang
# scatter to GNU ld porting, linker ordering, object ordering, 0xFF padding --
# so a version string alone is not enough. The container digest is the anchor.

schema_version: 1
recorded: "2026-08-08"

# RESTORE DRILL, 2026-08-08 -- read this before trusting either archive.
#
# fi101-selftest-src.tgz is the ORIGINAL vendor distribution and does NOT
# rebuild: 67 compile errors, CMSIS __ISB/__DSB macro conflicts. It also carries
# 315 macOS AppleDouble files the working tree does not have, and deleting those
# does not fix it. The working tree has diverged from the distribution in ways
# the distribution alone cannot reconstruct.
#
# selftest-worktree.tgz is the ACTUAL build tree and DOES rebuild, bit-exactly,
# for both images, from a clean extraction into an empty directory. Use it.
# The vendor tarball is kept only as the upstream reference.
restore_drill:
  date: "2026-08-08"
  from_vendor_tarball: FAILS (67 compile errors)
  from_worktree_archive: PASSES (both images bit-identical)
  worktree_archive: selftest-worktree.tgz
  worktree_archive_sha256: b85a53aa868f3ef473f68a016242acc6c95da4bdba9a4dcff4106dbf1fce66ff
  procedure: >-
    tar xzf build-env/selftest-worktree.tgz -C <empty>; cd <empty>/selftest;
    make -f Makefile.measure PROFILE=clean bins;
    make -f Makefile.pmu PROFILE=clean bins; compare against expected_output.

vendor_source:
  file: fi101-selftest-src.tgz
  status: UPSTREAM REFERENCE ONLY -- does not rebuild, see restore_drill
  sha256: 0811b0b7e5a34f12b87a9db5919bd0bc710b70d798ed14a43621c2d781d55518
  note: >-
    FI101 Selftest distribution. Extract, then overlay ../firmware/ on top
    (Selftest_measure/, Selftest_pmu/, Selftest/runner_v1_main.c,
    Selftest/raw_rx_main.c, LinkScripts/, Makefile.*).

